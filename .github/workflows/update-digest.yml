name: Update Slack Digest

on:
  schedule:
    # 평일 KST 10:05, 16:05, 18:05 (UTC 01:05, 07:05, 09:05)
    # 정시 회피 — GitHub Actions schedule은 매시 정각에 큐 폭주로 자주 지연/스킵됨
    - cron: '5 1 * * 1-5'
    - cron: '5 7 * * 1-5'
    - cron: '5 9 * * 1-5'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Fetch Slack data + update JSON
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        run: python scripts/fetch_and_update.py

      - name: Generate summaries + extract todos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/analyze_with_llm.py

      - name: Copy report.html to index.html
        run: cp report.html index.html

      - name: Send Slack DM notification
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        run: python scripts/notify_dm.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            DATE=$(TZ=Asia/Seoul date +"%Y-%m-%d %H:%M")
            git commit -m "자동 업데이트: $DATE KST"
            git push
          fi
